<!doctype html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>중앙 수호탑</title><link rel="stylesheet" href="./style.css?v=3"></head><body><main id="game"><div id="canvas"></div><div id="start" class="overlay"><section class="card"><div class="eyebrow">HERO DEFENSE</div><h1>중앙 수호탑</h1><p>영웅을 선택하고 사방에서 몰려오는 적을 막아내세요.<br>전투 · 레벨업 · 상점 · 아이템 · 보스 웨이브</p><button id="startBtn">게임 시작</button><div class="hint">WASD / 방향키 이동 · Q 스킬 · I 상점 · ESC 일시정지</div></section></div><div id="heroSelect" class="overlay hidden"><section class="card wide"><div class="eyebrow">CHOOSE HERO</div><h1>영웅 선택</h1><div id="heroChoices" class="heroChoices"><button id="warriorBtn" class="heroChoice"><b>전사</b><small>근접 · 높은 체력 · 충격파</small></button><button id="mageBtn" class="heroChoice"><b>마법사</b><small>원거리 · 광역 마법 · 강한 공격</small></button><button id="rangerBtn" class="heroChoice"><b>궁수</b><small>고속 공격 · 긴 사거리 · 연쇄 사격</small></button></div></section></div><div id="levelUp" class="overlay hidden"><section class="card"><div class="eyebrow">LEVEL UP</div><h1>성장 선택</h1><div id="levelChoices" class="choices"></div></section></div><div id="shop" class="overlay hidden"><section class="card wide shopCard"><div class="shopHead"><div><div class="eyebrow">SHOP</div><h1>상점</h1></div><strong id="shopGold">0 G</strong></div><div id="shopItems" class="shopItems"></div><div class="books"><h3>스탯 책</h3><div id="bookLine"></div></div><button id="shopClose">전투로 돌아가기</button></section></div><div id="pause" class="overlay hidden"><section class="card"><div class="eyebrow">PAUSED</div><h1>일시정지</h1><button id="resumeBtn">계속하기</button></section></div><div id="gameover" class="overlay hidden"><section class="card"><div class="eyebrow">GAME OVER</div><h1>수호탑 함락</h1><p id="overDetail"></p><button id="restartBtn">메뉴로</button></section></div></main><script src="./game2.js?v=hero1"></script></body></html>
