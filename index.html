<!doctype html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>중앙 수호탑</title><link rel="stylesheet" href="./style.css"></head><body><div id="game"><div id="canvas"></div><div id="towerPixel" aria-hidden="true"><div class="tp-shadow"></div><div class="tp-base"></div><div class="tp-wall"></div><div class="tp-roof"></div><div class="tp-turret tp-left"></div><div class="tp-turret tp-right"></div><div class="tp-core"></div><div class="tp-door"></div><div class="tp-banner"></div></div><div id="toast"></div><div id="start" class="overlay"><div class="card"><div class="eyebrow">PIXEL HERO DEFENSE</div><h1>중앙 수호탑</h1><p>영웅을 고르고 중앙 성을 지키세요.<br>웨이브 → 성장 → 아이템 → 보스 → 다음 웨이브.</p><button id="startBtn">영웅 선택 후 방어 시작</button></div></div><div id="upgrade" class="overlay hidden"><div class="card"><div class="eyebrow">LEVEL UP</div><h1>강화 선택</h1><p>세 가지 중 하나를 선택하세요.</p><div id="upgradeChoices"></div></div></div><div id="pause" class="overlay hidden"><div class="card"><div class="eyebrow">PAUSED</div><h1>일시정지</h1><p>방어를 잠시 멈췄습니다.</p><button id="resumeBtn">계속하기</button></div></div><div id="gameover" class="overlay hidden"><div class="card"><div class="eyebrow">TOWER FALLEN</div><h1>수호탑 함락</h1><p id="gameoverDetail"></p><button id="restartBtn">다시 시작</button></div></div></div><script src="./game2.js"></script></body></html>
