<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>아웃포스트 9</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<div id="game">
  <div id="canvas"></div>
  <div id="hud"></div>
  <div id="toast"></div>
  <div id="start" class="overlay"><div class="card">
    <div class="eyebrow">OUTPOST 9 · REBUILT</div><h1>아웃포스트 9</h1>
    <p>영웅을 직접 움직이고 타워를 배치해<br>무너진 전초기지를 끝까지 방어하세요.</p>
    <button id="startBtn">방어 시작</button>
  </div></div>
  <div id="upgrade" class="overlay hidden"><div class="card">
    <div class="eyebrow">WAVE CLEAR</div><h1>강화 선택</h1><p>이번 전투를 바꿀 강화 하나를 선택하세요.</p>
    <div id="upgradeChoices"></div>
  </div></div>
  <div id="gameover" class="overlay hidden"><div class="card">
    <div class="eyebrow">OUTPOST FALLEN</div><h1>기지가 함락되었습니다</h1><p id="gameoverDetail"></p>
    <button id="restartBtn">다시 방어</button>
  </div></div>
  <div id="buildBar">
    <button data-build="arrow">🏹<b>궁수</b><small>40G</small></button>
    <button data-build="ice">❄<b>빙결</b><small>55G</small></button>
    <button data-build="fire">🔥<b>화염</b><small>70G</small></button>
    <button data-build="wall">🧱<b>방벽</b><small>30G</small></button>
  </div>
  <div id="skillBar"><button id="skillBtn">⚡<span>전격</span><small>Q</small></button></div>
  <div id="hint">타워를 선택해 맵에 설치 · WASD/방향키 이동 · Q 전격</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/phaser@3.90.0/dist/phaser.min.js"></script>
<script src="./game.js"></script>
</body>
</html>
