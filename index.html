<!doctype html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>중앙 수호탑</title><link rel="stylesheet" href="./style.css"></head><body><div id="game"><div id="canvas"></div><div id="toast"></div><div id="start" class="overlay"><div class="card"><div class="eyebrow">PIXEL HERO DEFENSE</div><h1>중앙 수호탑</h1><p>중앙의 수호탑을 지키세요.<br>사방에서 몰려오는 적을 처치하고 영웅을 성장시키세요.</p><button id="startBtn">방어 시작</button></div></div><div id="upgrade" class="overlay hidden"><div class="card"><div class="eyebrow">LEVEL UP</div><h1>강화 선택</h1><p>영웅을 강화할 능력을 하나 선택하세요.</p><div id="upgradeChoices"></div></div></div><div id="pause" class="overlay hidden"><div class="card"><div class="eyebrow">PAUSED</div><h1>일시정지</h1><p>방어를 잠시 멈췄습니다.</p><button id="resumeBtn">계속하기</button></div></div><div id="gameover" class="overlay hidden"><div class="card"><div class="eyebrow">TOWER FALLEN</div><h1>수호탑 함락</h1><p id="gameoverDetail"></p><button id="restartBtn">다시 시작</button></div></div></div><script src="./game.js"></script></body></html>
